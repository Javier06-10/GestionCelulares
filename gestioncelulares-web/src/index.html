<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Gestión Celulares</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121214">
  <!-- Content-Security-Policy: mitiga XSS. 'unsafe-inline' en style es necesario para
       los estilos que Angular inyecta en runtime y el splash inline. connect-src incluye
       la API, los websockets del live-reload y la API de subida de Cloudinary; img-src
       incluye el CDN de entrega de Cloudinary para mostrar las fotos. Ajustar al desplegar. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' http://localhost:5289 https://localhost:7191 https://api.cloudinary.com ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    /* Pantalla de carga inicial: se muestra antes de que Angular arranque y
       se reemplaza sola al renderizar <app-root>. Teléfono girando en 3D. */
    .gc-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background: radial-gradient(circle at 50% 40%, #1b1b20 0%, #121214 70%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      z-index: 9999;
    }
    .gc-splash__stage {
      perspective: 700px;
      width: 84px;
      height: 150px;
      display: grid;
      place-items: center;
    }
    .gc-splash__phone {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: gc-spin 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      filter: drop-shadow(0 12px 30px rgba(0, 230, 118, 0.35));
    }
    .gc-splash__glow {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 230, 118, 0.22) 0%, transparent 65%);
      animation: gc-pulse 2.4s ease-in-out infinite;
    }
    .gc-splash__brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .gc-splash__name {
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
    }
    .gc-splash__name span { color: #00e676; }
    .gc-splash__dots { display: flex; gap: 6px; }
    .gc-splash__dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00e676;
      display: inline-block;
      animation: gc-bounce 1.2s ease-in-out infinite;
    }
    .gc-splash__dots i:nth-child(2) { animation-delay: 0.15s; }
    .gc-splash__dots i:nth-child(3) { animation-delay: 0.3s; }

    @keyframes gc-spin {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
    @keyframes gc-pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.55; }
      50%      { transform: scale(1.1); opacity: 1; }
    }
    @keyframes gc-bounce {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50%      { transform: translateY(-8px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gc-splash__phone { animation: gc-pulse 2s ease-in-out infinite; }
    }
  </style>
</head>
<body>
  <app-root>
    <!-- Splash mientras carga el bundle; Angular lo reemplaza al renderizar -->
    <div class="gc-splash">
      <div class="gc-splash__glow"></div>
      <div class="gc-splash__stage">
        <svg class="gc-splash__phone" viewBox="0 0 84 150" xmlns="http://www.w3.org/2000/svg" fill="none">
          <rect x="3" y="3" width="78" height="144" rx="16" fill="#0d0d10" stroke="#00e676" stroke-width="2.5"/>
          <rect x="9" y="14" width="66" height="122" rx="9" fill="#15151b"/>
          <rect x="9" y="14" width="66" height="122" rx="9" fill="url(#gc-screen)" opacity="0.5"/>
          <rect x="31" y="7" width="22" height="4" rx="2" fill="#00e676" opacity="0.7"/>
          <circle cx="42" cy="141" r="2.4" fill="#00e676" opacity="0.6"/>
          <circle cx="42" cy="70" r="15" fill="none" stroke="#00e676" stroke-width="2.5" opacity="0.9"/>
          <path d="M42 60 L42 70 L49 74" stroke="#6C5CE7" stroke-width="2.5" stroke-linecap="round"/>
          <defs>
            <linearGradient id="gc-screen" x1="9" y1="14" x2="75" y2="136" gradientUnits="userSpaceOnUse">
              <stop stop-color="#00e676" stop-opacity="0.35"/>
              <stop offset="1" stop-color="#6C5CE7" stop-opacity="0.25"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="gc-splash__brand">
        <div class="gc-splash__name">Gestión<span>Celulares</span></div>
        <div class="gc-splash__dots"><i></i><i></i><i></i></div>
      </div>
    </div>
  </app-root>
</body>
</html>
