<div class="login-bg min-h-screen grid place-items-center relative overflow-hidden px-4">
  <!-- Aurora animada de fondo -->
  <div class="aurora aurora-1"></div>
  <div class="aurora aurora-2"></div>
  <div class="aurora aurora-3"></div>
  <!-- Retícula sutil -->
  <div class="grid-overlay absolute inset-0 opacity-[0.15]"></div>

  <form
    class="relative w-[min(410px,92vw)] bg-tech-card-dark/60 backdrop-blur-2xl border border-white/10 rounded-3xl p-9 shadow-[0_30px_80px_-20px_rgba(0,0,0,0.7)]"
    [formGroup]="form"
    (ngSubmit)="entrar()"
  >
    <!-- Brillo superior de la tarjeta -->
    <div class="absolute inset-x-10 -top-px h-px bg-gradient-to-r from-transparent via-tech-accent/60 to-transparent"></div>

    <div class="flex flex-col items-center mb-8">
      <div class="relative w-16 h-16 rounded-2xl bg-gradient-to-br from-tech-accent/25 to-tech-purple/20 grid place-items-center mb-4 shadow-[0_0_40px_-5px_rgba(0,230,118,0.5)] ring-1 ring-white/10">
        <lucide-icon name="smartphone" [size]="30" class="text-tech-accent"></lucide-icon>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Gestión Celulares</h1>
      <p class="text-sm text-tech-steel mt-1.5">Plataforma de gestión integral</p>
    </div>

    <label class="block text-xs font-semibold text-tech-pastel mb-1.5 ml-1" for="usuario">USUARIO</label>
    <div class="relative mb-4">
      <lucide-icon name="user" [size]="18" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-tech-steel"></lucide-icon>
      <input
        id="usuario"
        type="text"
        formControlName="nombreUsuario"
        placeholder="admin"
        autocomplete="username"
        class="w-full pl-11 pr-3.5 py-3 rounded-xl bg-white/[0.04] border border-white/10 text-white placeholder:text-tech-steel/50 outline-none transition-all duration-300 focus:border-tech-accent/60 focus:bg-white/[0.07] focus:shadow-[0_0_0_4px_rgba(0,230,118,0.1)]"
      />
    </div>

    <label class="block text-xs font-semibold text-tech-pastel mb-1.5 ml-1" for="contrasena">CONTRASEÑA</label>
    <div class="relative mb-6">
      <lucide-icon name="lock" [size]="18" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-tech-steel"></lucide-icon>
      <input
        id="contrasena"
        type="password"
        formControlName="contrasena"
        placeholder="••••••••"
        autocomplete="current-password"
        class="w-full pl-11 pr-3.5 py-3 rounded-xl bg-white/[0.04] border border-white/10 text-white placeholder:text-tech-steel/50 outline-none transition-all duration-300 focus:border-tech-accent/60 focus:bg-white/[0.07] focus:shadow-[0_0_0_4px_rgba(0,230,118,0.1)]"
      />
    </div>

    @if (error()) {
      <div class="mb-5 px-4 py-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-sm">
        {{ error() }}
      </div>
    }

    <button
      type="submit"
      [disabled]="cargando()"
      class="group w-full py-3.5 rounded-xl bg-gradient-to-r from-tech-accent to-emerald-400 text-tech-bg-dark font-bold transition-all duration-300 ease-out hover:shadow-[0_8px_30px_-6px_rgba(0,230,118,0.6)] active:scale-[0.97] disabled:opacity-50 disabled:active:scale-100 flex items-center justify-center gap-2"
    >
      {{ cargando() ? 'Entrando…' : 'Entrar' }}
      @if (!cargando()) {
        <lucide-icon name="arrow-up-right" [size]="18" class="transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5"></lucide-icon>
      }
    </button>
  </form>
</div>
