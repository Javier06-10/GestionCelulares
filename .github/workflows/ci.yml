name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Cancela corridas viejas del mismo ref cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar
        run: dotnet restore GestionCelulares.sln

      - name: Compilar (Release)
        run: dotnet build GestionCelulares.sln --no-restore --configuration Release

      # Los tests usan EF Core InMemory: no necesitan SQL Server.
      - name: Pruebas
        run: dotnet test GestionCelulares.Tests/GestionCelulares.Tests.csproj --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestioncelulares-web
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gestioncelulares-web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas (Karma headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Compilar (production)
        run: npx ng build --configuration production
